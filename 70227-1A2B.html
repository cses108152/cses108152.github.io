<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1A2B Pro Cyber Edition</title>

<style>
:root{
    --cyan:#00ffff;
    --green:#00ff88;
    --red:#ff4d4d;
    --bg:#020617;
    --panel:#0f172a;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
    radial-gradient(circle at top,#0f172a,#020617 60%);
    color:white;
    font-family:"Microsoft JhengHei",sans-serif;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
}

.card{
    background:rgba(15,23,42,.85);
    border:1px solid rgba(0,255,255,.2);
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 30px rgba(0,255,255,.15);
}

h1{
    text-align:center;
    color:var(--cyan);
    text-shadow:0 0 15px var(--cyan);
    margin-bottom:15px;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:20px;
}

.stat{
    background:#111827;
    padding:15px;
    border-radius:12px;
    text-align:center;
}

.stat-title{
    color:#94a3b8;
    font-size:13px;
}

.stat-value{
    margin-top:5px;
    font-size:24px;
    color:var(--cyan);
}

.input-row{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:15px;
    font-size:24px;
    text-align:center;
    border:none;
    border-radius:12px;
    background:#111827;
    color:var(--cyan);
}

input:focus{
    outline:none;
    box-shadow:0 0 15px var(--cyan);
}

button{
    border:none;
    cursor:pointer;
    border-radius:12px;
    padding:15px 20px;
    font-weight:bold;
    transition:.25s;
}

button:hover{
    transform:translateY(-2px);
}

.guess{
    background:var(--cyan);
}

.hint{
    background:#f59e0b;
    color:white;
}

.reset{
    background:var(--red);
    color:white;
}

.controls{
    margin-top:10px;
    display:flex;
    gap:10px;
}

.controls button{
    flex:1;
}

.message{
    margin-top:20px;
    text-align:center;
    font-size:22px;
    min-height:60px;
}

.win{
    color:var(--green);
    animation:pulse 1s infinite alternate;
}

@keyframes pulse{
    from{
        text-shadow:0 0 10px var(--green);
    }
    to{
        text-shadow:0 0 30px var(--green);
    }
}

.history{
    margin-top:25px;
}

.history h2,
.ranking h2{
    color:var(--cyan);
    margin-bottom:10px;
}

.record{
    display:flex;
    justify-content:space-between;
    background:#111827;
    padding:12px;
    margin-bottom:8px;
    border-radius:10px;
}

.result{
    color:var(--cyan);
    font-weight:bold;
}

.ranking{
    margin-top:25px;
}

.rank-item{
    background:#111827;
    margin-bottom:8px;
    padding:12px;
    border-radius:10px;
}

footer{
    text-align:center;
    margin-top:20px;
    color:#64748b;
}
</style>
</head>
<body>

<div class="container">

<div class="card">

<h1>🎯 1A2B PRO</h1>

<div class="subtitle">
猜出 4 個不重複數字
</div>

<div class="stats">

<div class="stat">
<div class="stat-title">猜測次數</div>
<div id="guessCount" class="stat-value">0</div>
</div>

<div class="stat">
<div class="stat-title">經過時間</div>
<div id="timer" class="stat-value">0</div>
</div>

<div class="stat">
<div class="stat-title">提示次數</div>
<div id="hintCount" class="stat-value">0</div>
</div>

</div>

<div class="input-row">
<input
id="guessInput"
maxlength="4"
placeholder="輸入4位數"
/>

<button class="guess" onclick="checkGuess()">
猜測
</button>
</div>

<div class="controls">
<button class="hint" onclick="giveHint()">
💡 提示
</button>

<button class="reset" onclick="newGame()">
🔄 重開
</button>
</div>

<div id="message" class="message"></div>

<div class="history">
<h2>📜 猜測紀錄</h2>
<div id="records"></div>
</div>

<div class="ranking">
<h2>🏆 最佳紀錄</h2>
<div id="ranking"></div>
</div>

</div>

<footer>
Cyber Edition • LocalStorage 排行榜
</footer>

</div>

<script>

let answer="";
let count=0;
let hints=0;
let seconds=0;
let timerId=null;

function generateAnswer(){

    let arr=[];

    while(arr.length<4){

        let n=Math.floor(Math.random()*10);

        if(!arr.includes(n)){
            arr.push(n);
        }
    }

    return arr.join("");
}

function startTimer(){

    clearInterval(timerId);

    timerId=setInterval(()=>{

        seconds++;

        document.getElementById("timer").textContent=
            seconds+"s";

    },1000);
}

function checkGuess(){

    let guess=
    document.getElementById("guessInput")
    .value.trim();

    if(!/^\d{4}$/.test(guess)){
        alert("請輸入4位數字");
        return;
    }

    if(new Set(guess).size!==4){
        alert("數字不可重複");
        return;
    }

    count++;

    document.getElementById("guessCount")
    .textContent=count;

    let A=0;
    let B=0;

    for(let i=0;i<4;i++){

        if(guess[i]===answer[i]){
            A++;
        }
        else if(answer.includes(guess[i])){
            B++;
        }
    }

    let div=document.createElement("div");

    div.className="record";

    div.innerHTML=
    `<span>${guess}</span>
     <span class="result">${A}A${B}B</span>`;

    document
    .getElementById("records")
    .prepend(div);

    if(A===4){

        clearInterval(timerId);

        document.getElementById("message")
        .innerHTML=
        `<div class="win">
        🎉 挑戰成功！<br>
        答案：${answer}<br>
        ${count}次 / ${seconds}秒
        </div>`;

        saveScore();
    }

    document.getElementById("guessInput").value="";
}

function giveHint(){

    hints++;

    document.getElementById("hintCount")
    .textContent=hints;

    let index=
    Math.floor(Math.random()*4);

    alert(
      `提示：第 ${index+1} 位數字是 ${answer[index]}`
    );
}

function saveScore(){

    let records=
    JSON.parse(
      localStorage.getItem("1A2B_RANK")
      || "[]"
    );

    records.push({
        count,
        seconds,
        date:new Date().toLocaleString()
    });

    records.sort((a,b)=>{

        if(a.count===b.count){
            return a.seconds-b.seconds;
        }

        return a.count-b.count;
    });

    records=records.slice(0,10);

    localStorage.setItem(
        "1A2B_RANK",
        JSON.stringify(records)
    );

    loadRanking();
}

function loadRanking(){

    let records=
    JSON.parse(
        localStorage.getItem("1A2B_RANK")
        || "[]"
    );

    let html="";

    records.forEach((r,i)=>{

        html+=`
        <div class="rank-item">
        #${i+1}
        ｜${r.count}次
        ｜${r.seconds}秒
        </div>
        `;
    });

    document.getElementById("ranking")
    .innerHTML=
    html || "尚無紀錄";
}

function newGame(){

    answer=generateAnswer();

    count=0;
    hints=0;
    seconds=0;

    document.getElementById("guessCount")
    .textContent="0";

    document.getElementById("hintCount")
    .textContent="0";

    document.getElementById("timer")
    .textContent="0s";

    document.getElementById("records")
    .innerHTML="";

    document.getElementById("message")
    .innerHTML="";

    document.getElementById("guessInput")
    .value="";

    startTimer();

    console.log("答案:",answer);
}

document
.getElementById("guessInput")
.addEventListener("keydown",(e)=>{

    if(e.key==="Enter"){
        checkGuess();
    }
});

loadRanking();
newGame();

</script>

</body>
</html>
